<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ─── Reset & Base ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
            padding: 1.5rem;
        }

        /* ─── Card ─── */
        .card {
            width: 100%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 2.5rem 2.2rem 2.8rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* ─── Header ─── */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .header .icon {
            font-size: 2rem;
            line-height: 1;
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f4ff, #b6c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── Input Group ─── */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .input-row .field {
            flex: 1 1 0;
            min-width: 80px;
        }

        .input-row .field input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 1.2rem;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
        }

        .input-row .field input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

        .input-row .field input:focus {
            border-color: #7a9cff;
            box-shadow: 0 0 0 4px rgba(122, 156, 255, 0.15);
        }

        .input-row .field input::-webkit-outer-spin-button,
        .input-row .field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-row .field input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* ─── Buttons ─── */
        .actions {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2.2rem;
        }

        .btn {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6b8cff, #4a6cf7);
            color: #fff;
            box-shadow: 0 8px 24px -6px rgba(74, 108, 247, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(74, 108, 247, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* ─── Result ─── */
        .result {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1.8rem;
            padding: 1.8rem 1.8rem 1.6rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result .placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .result .age-display {
            display: none;
            width: 100%;
            animation: fadeUp 0.5s ease forwards;
        }

        .result .age-display.show {
            display: block;
        }

        .result .age-main {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e8edff, #9bb0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .result .age-main span {
            font-size: 1.4rem;
            font-weight: 500;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
            color: rgba(255, 255, 255, 0.5);
            margin-left: 0.2rem;
        }

        .result .age-detail {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .result .age-detail .item {
            display: flex;
            align-items: baseline;
            gap: 0.3rem;
        }

        .result .age-detail .item .num {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }

        .result .age-detail .item .lbl {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .result .birthday-badge {
            display: inline-block;
            margin-top: 0.7rem;
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd866;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .result .error-msg {
            color: #ff7b89;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* ─── Animations ─── */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── Responsive ─── */
        @media (max-width: 500px) {
            .card {
                padding: 1.8rem 1.2rem 2rem;
                border-radius: 1.8rem;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .input-row .field {
                min-width: 60px;
            }

            .input-row .field input {
                padding: 0.7rem 0.7rem;
                font-size: 0.9rem;
            }

            .result .age-main {
                font-size: 2.4rem;
            }

            .result .age-detail {
                gap: 1rem;
            }

            .result .age-detail .item .num {
                font-size: 1rem;
            }

            .btn {
                font-size: 0.9rem;
                padding: 0.75rem 0.8rem;
            }

            .actions {
                flex-direction: column;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.2rem 0.8rem 1.5rem;
            }

            .input-row {
                flex-direction: column;
            }

            .input-row .field {
                min-width: unset;
            }
        }
    </style>
</head>

<body>

    <div class="card" role="main" aria-label="Age Calculator">

        <!-- Header -->
        <div class="header">
            <span class="icon">🎂</span>
            <h1>Age Calculator</h1>
        </div>

        <!-- Inputs -->
        <div class="input-group">
            <label for="dob">Date of Birth</label>
            <div class="input-row">
                <div class="field">
                    <input type="number" id="day" placeholder="DD" min="1" max="31" inputmode="numeric" />
                </div>
                <div class="field">
                    <input type="number" id="month" placeholder="MM" min="1" max="12" inputmode="numeric" />
                </div>
                <div class="field">
                    <input type="number" id="year" placeholder="YYYY" min="1900" max="2099" inputmode="numeric" />
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary" id="calculateBtn">
                <span>✨</span> Calculate Age
            </button>
            <button class="btn btn-secondary" id="clearBtn">
                <span>↺</span> Clear
            </button>
        </div>

        <!-- Result -->
        <div class="result" id="resultContainer">
            <div class="placeholder" id="placeholder">
                Enter your birth date and click <strong>Calculate</strong>
            </div>

            <div class="age-display" id="ageDisplay">
                <div class="age-main" id="ageMain">
                    0 <span>years</span>
                </div>
                <div class="age-detail" id="ageDetail">
                    <div class="item">
                        <span class="num" id="detailMonths">0</span>
                        <span class="lbl">Months</span>
                    </div>
                    <div class="item">
                        <span class="num" id="detailDays">0</span>
                        <span class="lbl">Days</span>
                    </div>
                </div>
                <div id="birthdayBadgeContainer"></div>
                <div id="errorContainer"></div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ────────────────────────────────────────────────
            const dayInput = document.getElementById('day');
            const monthInput = document.getElementById('month');
            const yearInput = document.getElementById('year');
            const calculateBtn = document.getElementById('calculateBtn');
            const clearBtn = document.getElementById('clearBtn');

            const placeholder = document.getElementById('placeholder');
            const ageDisplay = document.getElementById('ageDisplay');
            const ageMain = document.getElementById('ageMain');
            const detailMonths = document.getElementById('detailMonths');
            const detailDays = document.getElementById('detailDays');
            const birthdayBadgeContainer = document.getElementById('birthdayBadgeContainer');
            const errorContainer = document.getElementById('errorContainer');

            // ─── Helpers ────────────────────────────────────────────────

            /** Validate a date (year, month, day) */
            function isValidDate(y, m, d) {
                // Basic range checks
                if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return false;
                if (y < 1900 || y > 2099) return false;
                if (m < 1 || m > 12) return false;
                if (d < 1 || d > 31) return false;

                // Use JS Date to validate day-in-month
                const date = new Date(y, m - 1, d);
                return (
                    date.getFullYear() === y &&
                    date.getMonth() === m - 1 &&
                    date.getDate() === d
                );
            }

            /** Calculate age in years, months, days from birth date to today */
            function calculateAge(birthDate) {
                const today = new Date();
                // Zero out time for accurate day diff
                const todayClean = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const birthClean = new Date(birthDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());

                let years = todayClean.getFullYear() - birthClean.getFullYear();
                let months = todayClean.getMonth() - birthClean.getMonth();
                let days = todayClean.getDate() - birthClean.getDate();

                // Adjust if days negative
                if (days < 0) {
                    // Days in previous month
                    const prevMonth = new Date(todayClean.getFullYear(), todayClean.getMonth(), 0);
                    const daysInPrevMonth = prevMonth.getDate();
                    days += daysInPrevMonth;
                    months -= 1;
                }

                // Adjust if months negative
                if (months < 0) {
                    months += 12;
                    years -= 1;
                }

                // If age is negative (birth date in future), return null
                if (years < 0) return null;
                if (years === 0 && months === 0 && days === 0) {
                    // Born today
                    return { years: 0, months: 0, days: 0 };
                }

                return { years, months, days };
            }

            /** Check if today is the birthday */
            function isBirthdayToday(birthDate) {
                const today = new Date();
                return (
                    today.getMonth() === birthDate.getMonth() &&
                    today.getDate() === birthDate.getDate()
                );
            }

            /** Format a number with leading zero if needed */
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            /** Clear error messages and badges */
            function clearMessages() {
                errorContainer.innerHTML = '';
                birthdayBadgeContainer.innerHTML = '';
            }

            /** Show error message */
            function showError(msg) {
                errorContainer.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
                birthdayBadgeContainer.innerHTML = '';
            }

            /** Show birthday badge */
            function showBirthdayBadge() {
                birthdayBadgeContainer.innerHTML = `<div class="birthday-badge">🎉 Happy Birthday! 🎉</div>`;
            }

            /** Display the age result */
            function displayAge(age, birthDate) {
                // Main
                const yearWord = age.years === 1 ? 'year' : 'years';
                ageMain.innerHTML = `${age.years} <span>${yearWord}</span>`;

                // Detail
                detailMonths.textContent = age.months;
                detailDays.textContent = age.days;

                // Show display, hide placeholder
                placeholder.style.display = 'none';
                ageDisplay.classList.add('show');
                ageDisplay.style.display = 'block';

                // Birthday badge
                if (isBirthdayToday(birthDate) && age.years > 0) {
                    showBirthdayBadge();
                } else {
                    birthdayBadgeContainer.innerHTML = '';
                }

                clearMessages();
            }

            /** Reset the UI to placeholder state */
            function resetToPlaceholder() {
                placeholder.style.display = 'block';
                ageDisplay.classList.remove('show');
                ageDisplay.style.display = 'none';
                clearMessages();
                errorContainer.innerHTML = '';
                birthdayBadgeContainer.innerHTML = '';
            }

            /** Main calculation logic */
            function performCalculation() {
                // Read values
                const dayVal = parseInt(dayInput.value.trim(), 10);
                const monthVal = parseInt(monthInput.value.trim(), 10);
                const yearVal = parseInt(yearInput.value.trim(), 10);

                // Validate inputs are numbers
                if (isNaN(dayVal) || isNaN(monthVal) || isNaN(yearVal)) {
                    showError('Please enter a valid day, month, and year.');
                    placeholder.style.display = 'none';
                    ageDisplay.classList.remove('show');
                    ageDisplay.style.display = 'none';
                    birthdayBadgeContainer.innerHTML = '';
                    return;
                }

                // Validate date
                if (!isValidDate(yearVal, monthVal, dayVal)) {
                    showError('Invalid date. Please check your day, month, and year.');
                    placeholder.style.display = 'none';
                    ageDisplay.classList.remove('show');
                    ageDisplay.style.display = 'none';
                    birthdayBadgeContainer.innerHTML = '';
                    return;
                }

                const birthDate = new Date(yearVal, monthVal - 1, dayVal);
                const age = calculateAge(birthDate);

                if (age === null) {
                    showError('Birth date cannot be in the future. Please enter a valid past date.');
                    placeholder.style.display = 'none';
                    ageDisplay.classList.remove('show');
                    ageDisplay.style.display = 'none';
                    birthdayBadgeContainer.innerHTML = '';
                    return;
                }

                // All good – display result
                displayAge(age, birthDate);
            }

            /** Clear all inputs and reset UI */
            function clearAll() {
                dayInput.value = '';
                monthInput.value = '';
                yearInput.value = '';
                resetToPlaceholder();
                // Also remove any error
                errorContainer.innerHTML = '';
                birthdayBadgeContainer.innerHTML = '';
                // Ensure placeholder is visible
                placeholder.style.display = 'block';
                ageDisplay.classList.remove('show');
                ageDisplay.style.display = 'none';
                // Focus first input
                dayInput.focus();
            }

            // ─── Event Listeners ───────────────────────────────────────

            calculateBtn.addEventListener('click', performCalculation);

            clearBtn.addEventListener('click', clearAll);

            // Enter key support: trigger calculation on Enter in any input
            [dayInput, monthInput, yearInput].forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        performCalculation();
                    }
                });

                // Auto-advance on max length (optional UX)
                input.addEventListener('input', function() {
                    const maxLen = parseInt(this.getAttribute('maxlength'), 10);
                    if (maxLen && this.value.length >= maxLen) {
                        const next =
                            this.id === 'day' ? monthInput :
                            this.id === 'month' ? yearInput :
                            null;
                        if (next) next.focus();
                    }
                });
            });

            // Set maxlength attributes for better UX
            dayInput.setAttribute('maxlength', '2');
            monthInput.setAttribute('maxlength', '2');
            yearInput.setAttribute('maxlength', '4');

            // ─── Init ──────────────────────────────────────────────────

            // Start with placeholder visible, age hidden
            resetToPlaceholder();

            // Optional: Pre-fill with today's date for testing? No – keep empty.
            // But we set placeholder text.

            console.log('🎂 Age Calculator ready!');
        })();
    </script>

</body>
</html>
