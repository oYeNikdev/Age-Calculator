<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="card" role="main" aria-label="Age Calculator">
        <!-- Header -->
        <div class="header">
            <span class="icon"></span>
            <h1>Age Calculator</h1>
        </div>

        <!-- Inputs -->
        <div class="input-group">
            <label for="dob">Date of Birth</label>
            <div class="input-row">
                <div class="field">
                    <input type="number" id="day" placeholder="DD" min="1" max="31" inputmode="numeric" />
                </div>
                <div class="field">
                    <input type="number" id="month" placeholder="MM" min="1" max="12" inputmode="numeric" />
                </div>
                <div class="field">
                    <input type="number" id="year" placeholder="YYYY" min="1900" max="2099" inputmode="numeric" />
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary" id="calculateBtn">
                <span></span> Calculate Age
            </button>
            <button class="btn btn-secondary" id="clearBtn">
                <span>↺</span> Clear
            </button>
        </div>

        <!-- Result -->
        <div class="result" id="resultContainer">
            <div class="placeholder" id="placeholder">
                Enter your birth date and click <strong>Calculate</strong>
            </div>

            <div class="age-display" id="ageDisplay">
                <div class="age-main" id="ageMain">
                    0 <span>years</span>
                </div>
                <div class="age-detail" id="ageDetail">
                    <div class="item">
                        <span class="num" id="detailMonths">0</span>
                        <span class="lbl">Months</span>
                    </div>
                    <div class="item">
                        <span class="num" id="detailDays">0</span>
                        <span class="lbl">Days</span>
                    </div>
                </div>
                <div id="birthdayBadgeContainer"></div>
                <div id="errorContainer"></div>
            </div>
        </div>
    </div>
</body>
</html>
